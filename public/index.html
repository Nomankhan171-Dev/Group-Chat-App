<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Chat - Two User Test</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-title">✨ <span>Group Chat</span> 🥰</header>

    <section class="user-grid">
      <section class="user-column" data-user="1">
        <h2>User Window 1</h2>

        <form id="joinFormA" class="join-card">
          <h3>Join a Chat Group</h3>
          <label for="nameA">Username</label>
          <input id="nameA" type="text" placeholder="Enter your name" maxlength="40" autocomplete="off" required>

          <label for="roomA">Room ID</label>
          <input id="roomA" type="text" placeholder="E.g. 12" maxlength="35" autocomplete="off" required>

          <div id="joinErrorA" class="form-error hidden"></div>
          <button class="join-btn" type="submit">Join Room</button>
        </form>

        <section id="chatCardA" class="chat-card hidden">
          <header class="chat-header">
            <strong>Room: <span id="roomLabelA">-</span></strong>
            <button id="leaveA" class="leave-btn" type="button">Leave</button>
          </header>

          <div id="messagesA" class="messages" aria-live="polite"></div>
          <div id="chatErrorA" class="form-error chat-error hidden"></div>

          <form id="messageFormA" class="composer">
            <input id="messageA" type="text" placeholder="Type message..." maxlength="1000" autocomplete="off">
            <button type="submit">Send</button>
          </form>
        </section>
      </section>

      <section class="user-column" data-user="2">
        <h2>User Window 2</h2>

        <form id="joinFormB" class="join-card">
          <h3>Join a Chat Group</h3>
          <label for="nameB">Username</label>
          <input id="nameB" type="text" placeholder="Enter your name" maxlength="40" autocomplete="off" required>

          <label for="roomB">Room ID</label>
          <input id="roomB" type="text" placeholder="E.g. 12" maxlength="35" autocomplete="off" required>

          <div id="joinErrorB" class="form-error hidden"></div>
          <button class="join-btn" type="submit">Join Room</button>
        </form>

        <section id="chatCardB" class="chat-card hidden">
          <header class="chat-header">
            <strong>Room: <span id="roomLabelB">-</span></strong>
            <button id="leaveB" class="leave-btn" type="button">Leave</button>
          </header>

          <div id="messagesB" class="messages" aria-live="polite"></div>
          <div id="chatErrorB" class="form-error chat-error hidden"></div>

          <form id="messageFormB" class="composer">
            <input id="messageB" type="text" placeholder="Type message..." maxlength="1000" autocomplete="off">
            <button type="submit">Send</button>
          </form>
        </section>
      </section>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
